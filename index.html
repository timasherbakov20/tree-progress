<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дерево достижений</title>
<meta name="theme-color" content="#0D1015">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("achv-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
/* ===== ПАЛИТРА: меняйте здесь ===== */
:root{
  color-scheme:dark;
  --bg:#0D1015;      /* фон */
  --card:#151922;    /* карточки и панель */
  --ink:#E8EBF2;     /* основной текст */
  --muted:#8B93A3;   /* подписи */
  --line:#3A4252;    /* линии карты */
  --accent:#7C93FF;  /* акцент */
  --acc-rgb:124,147,255;
  --edge:#262D39;    /* рамки */
  --track:#222936;   /* треки прогресса */
  --btnb:#303847;
  --desc:#B5BCCA;
  --danger:#FF7B72;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#F2F3F5;--card:#fff;--ink:#15181C;--muted:#737A85;--line:#B9BFC9;
  --accent:#3B5BDB;--acc-rgb:59,91,219;--edge:#D9DDE3;--track:var(--track);--btnb:var(--btnb);--desc:var(--desc);--danger:var(--danger);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
html{scroll-behavior:smooth}
body{overflow-x:hidden;-webkit-text-size-adjust:100%}
#mapbox{display:none;position:relative;height:100vh;height:100svh;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%}
/* дашборд */
#dash{max-width:920px;margin:0 auto;padding:max(62px,calc(env(safe-area-inset-top) + 50px)) 16px 8px}
#dash h1{margin:0;font-size:26px;font-weight:500}
.date{margin:4px 0 18px;font:12px var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:18px}
#dash>.card{margin-bottom:12px}
.card h3{margin:0 0 14px;font:500 13px var(--sans);color:var(--muted)}
.card .note{margin:12px 0 0}
.rec{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--edge)}
.rec:first-of-type{border-top:0;padding-top:0}
.rec b{display:block;font-weight:500;font-size:15px;line-height:1.3}
.rec span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;margin:8px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis b{display:block;font-size:24px;font-weight:500;line-height:1.1}
.kpis span{font-size:11px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.heat{display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.heat i{aspect-ratio:1;background:var(--track);border-radius:2px;display:block}
.cols{display:flex;gap:8px;align-items:flex-end;height:130px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font:10px var(--mono);color:var(--muted)}
.cols i{display:block;width:100%;background:var(--accent);border-radius:2px 2px 0 0}
.hrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;margin:0 0 10px;font-size:13px}
.trk{height:6px;background:var(--track);border-radius:8px}
.trk i{display:block;height:6px;background:var(--accent);border-radius:8px}
.hrow em{font:12px var(--mono);font-style:normal;color:var(--muted)}
.lg{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--edge);font-size:13px}
.lg span{color:var(--muted);font:12px var(--mono)}
.lg button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:12px var(--mono);padding:10px 16px;border-radius:10px;z-index:9}
#launch{text-align:center;padding:30px 16px 38px}
#lb{width:76px;height:76px;border-radius:50%;border:1px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;display:inline-grid;place-items:center;transition:border-color .3s,color .3s}
#lb:hover,#lb[aria-expanded=true]{border-color:var(--accent);color:var(--accent)}
#lc{margin:14px 0 2px;font-size:16px;font-weight:500}
#ls{margin:0;font:12px var(--mono);color:var(--muted)}
#cam{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.edge{stroke:var(--line);stroke-width:1;fill:none;transition:opacity .4s}
.edge.fresh{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fly{from{opacity:0;transform:translate(var(--fx,0),var(--fy,0))}}
.node{cursor:pointer;outline:none;transition:opacity .3s}
.fresh .nb{animation:fly .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
.out{opacity:0!important}
.nb{transition:opacity .5s}
.dim .nb,.edge.dim{opacity:.22}
.dot{fill:var(--ink);transition:fill .3s}
.ach .dot{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.track{stroke:var(--line);stroke-width:2;opacity:.6}
.arc{stroke:var(--c,var(--accent));stroke-width:2;stroke-linecap:round;transition:stroke-dasharray .6s}
.root .track,.root .arc{display:none}
.done .dot{fill:var(--c,var(--accent));stroke:var(--c,var(--accent))}
.node:hover .dot{fill:var(--accent)}
.hit{fill:transparent}
.node:focus-visible .hit{stroke:var(--accent);stroke-dasharray:3 3}
.lab{fill:var(--ink);font-size:15px;font-weight:500;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.ach .lab{font-size:13px;font-weight:400;fill:var(--muted)}
.root .lab{font-size:24px}
.sel .lab{fill:var(--accent)}
.cnt{font:11px var(--mono);fill:var(--muted)}
.sub{font:11px var(--mono);fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
#hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:13px;color:var(--muted);transition:opacity .6s;pointer-events:none}
#hint.gone{opacity:0}
/* панель */
#panel{position:fixed;top:0;right:0;bottom:0;width:340px;background:var(--card);border-left:1px solid var(--edge);padding:28px 26px;overflow:auto;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:4}
.pan #panel{transform:none}
#px{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:6px}
#pc h2{margin:0 0 14px;font-size:23px;line-height:1.25;font-weight:500}
.meta{margin:0 0 10px;font:12px var(--mono);color:var(--muted)}
.meta i{font-style:normal;margin-left:12px}
.bar{height:3px;background:var(--track);margin:0 0 6px}
.bar b{display:block;height:100%;background:var(--accent);transition:width .5s}
.pct{margin:0 0 18px;font:12px var(--mono);color:var(--accent)}
.desc{margin:0;font-size:16px;line-height:1.6;color:var(--desc)}
.note{margin:0 0 14px;font-size:12px;line-height:1.5;color:var(--muted)}
.f{display:block;margin:0 0 14px}
.f span{display:block;font:11px var(--mono);color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:15px var(--sans);padding:8px 10px;border:1px solid var(--edge);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;margin:0 0 18px;font-size:14px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:12px var(--mono);padding:7px 10px;border:1px solid var(--btnb);background:var(--card);border-radius:8px;cursor:pointer;color:var(--ink);list-style:none}
.btn:hover{border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* инструменты правки */
#tools{position:absolute;top:16px;left:16px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;max-width:calc(100% - 32px);z-index:5}
#ed{display:flex;gap:8px;align-items:flex-start}
details{position:relative}
summary::-webkit-details-marker{display:none}
.menu{position:absolute;margin-top:6px;background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;width:260px}
@media (max-width:700px){
  input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}
  .ach .lab{font-size:12px}
  .btn{padding:9px 12px}
  #panel{top:auto;left:0;width:auto;height:52vh;border-left:0;border-top:1px solid var(--edge);transform:translateY(100%)}
  .pan #panel{transform:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.edge.fresh{stroke-dashoffset:0}}

/* ===== календарь ===== */
.calh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.calh h3{margin:0}
.caln{display:flex;align-items:center;gap:6px}
.caln b{font:500 14px var(--sans);min-width:116px;text-align:center;text-transform:capitalize}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calg .wd{font:11px var(--mono);color:var(--muted);text-align:center;padding:2px 0 4px}
.cd{height:44px;border:1px solid transparent;border-radius:8px;background:var(--track);color:var(--ink);font:12px var(--mono);cursor:pointer;padding:0;display:grid;place-items:center}
.cd:hover{border-color:var(--btnb)}
.cd.today{border-color:var(--accent)}
.cd.sel{outline:2px solid var(--ink);outline-offset:1px}
.cd.off{background:transparent;cursor:default;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:16px 0 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dayd{margin-top:14px;padding-top:12px;border-top:1px solid var(--edge)}
.dayd b{font-weight:500;font-size:14px;display:block;margin-bottom:6px}
.dayd .note{margin:6px 0 0}
/* ===== тёмная тема по умолчанию, оформление ===== */
body{font-feature-settings:"tnum" 1}
.card{box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px -20px rgba(0,0,0,.6)}
:root[data-theme=light] .card{box-shadow:0 1px 2px rgba(20,24,30,.04),0 12px 26px -18px rgba(20,24,30,.2)}
#theme{position:absolute;top:14px;right:14px;z-index:6;width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:var(--card);color:var(--ink);font-size:17px;line-height:1;cursor:pointer}
#theme:hover{border-color:var(--accent)}
#dash[hidden]+#launch{padding-top:70px}
#mapbox{background:radial-gradient(ellipse 60% 50% at 50% 48%,rgba(var(--acc-rgb),.09),transparent 70%)}
#mapbox::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(var(--edge) 1px,transparent 1.3px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 72%)}
#lb{box-shadow:0 0 0 8px rgba(var(--acc-rgb),.07)}
.cat .dot{fill:var(--c,var(--ink))}
.ach .dot{stroke:var(--c,var(--ink))}
.done .dot,.ach.done .dot{fill:var(--c,var(--accent));stroke:var(--c,var(--accent))}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 20px}
.hd .date{margin:4px 0 0}
.goal{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font:11px var(--mono);cursor:pointer;padding:0}
.rt{font:500 14px var(--sans);fill:var(--ink)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}
.sec h2{margin:0;font-size:19px;font-weight:500}
.seg{display:flex;background:var(--track);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font:12px var(--mono);padding:6px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink)}
.timer{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.tv{font:500 24px var(--mono);margin-right:auto}
.stack{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin:0 0 16px}
.stack i{display:block;min-width:3px}
.tot{margin:0 0 14px;font-size:28px;font-weight:500;line-height:1}
.tot span{font-size:13px;color:var(--muted);font-weight:400}
.ins{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--desc)}
.ins:first-of-type{margin-top:16px;padding-top:14px;border-top:1px solid var(--edge)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.enter>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(n+3){animation-delay:.08s}
.enter>*:nth-child(n+5){animation-delay:.16s}
</style>
</head>
<body>
<button id="theme" aria-label="Сменить тему">☾</button>
<main id="dash" hidden></main>
<section id="launch">
  <button id="lb" aria-expanded="false" aria-label="Дерево достижений">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="15" cy="15" r="3" fill="currentColor"/><circle cx="5" cy="6" r="2"/><circle cx="25" cy="7" r="2"/><circle cx="6" cy="25" r="2"/><circle cx="25" cy="24" r="2"/><path d="M15 15L5 6M15 15L25 7M15 15L6 25M15 15L25 24"/></svg>
  </button>
  <p id="lc">Дерево достижений</p><p id="ls"></p>
</section>
<div id="mapbox">
<svg id="map" role="group" aria-label="Карта достижений"><g id="cam"><g id="edges"></g><g id="nodes"></g></g></svg>
<p id="hint">Нажмите на категорию, чтобы увидеть достижения</p>
<div id="tools" hidden>
  <button class="btn" id="tg">Править</button>
  <span id="ed" hidden>
    <button class="btn" id="addc">+ Категория</button>
    <details><summary class="btn">Данные</summary>
      <div class="menu">
        <button class="btn" id="bcopy">Скопировать код для файла</button>
        <button class="btn" id="bdl">Скачать JSON</button>
        <button class="btn" id="bup">Загрузить JSON</button>
        <button class="btn danger" id="brst">Сбросить к данным из файла</button>
        <p class="note">Правки хранятся только в этом браузере. Чтобы опубликовать: «Скопировать код» и вставьте вместо <code>const DATA = …;</code> в index.html.</p>
      </div></details>
  </span>
</div>
</div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<aside id="panel"><button id="px" aria-label="Закрыть">×</button><div id="pc"></div></aside>

<script>
/* ===== ДАННЫЕ — то, что видят посетители сайта =====
   root: имя в центре. tree: категории верхнего уровня.
   Узел: name, date (ГГГГ-ММ), group, desc, progress (0–100), done (true/false), children (подпункты, любая глубина).
   У узла с children прогресс считается автоматически по подпунктам.
   Удобнее править в режиме правки на сайте и копировать код кнопкой «Данные». */
const DATA = {
  root: { name: "Тимофей", tagline: "достижения" },
  tree: [
    { name: "Образование", children: [
      { name: "Призёр школьной олимпиады по физике", date: "2025-12", group: "Олимпиады", desc: "Решил задачи по механике и электричеству, разобрал ошибки с учителем.", progress: 100, done: true },
      { name: "Курс по математическому анализу", date: "2026-03", group: "Онлайн-курсы", desc: "Пределы, производные, интегралы — с конспектом и задачами.", progress: 60 },
      { name: "Углублённая математика", date: "2025-09", group: "Школа", desc: "Дополнительные занятия по алгебре и геометрии.", progress: 100, done: true } ] },
    { name: "Технические проекты", children: [
      { name: "Первая схема на Arduino", date: "2025-06", group: "Электроника", desc: "Датчик температуры и вывод на дисплей.", progress: 100, done: true },
      { name: "Сайт-визитка на чистом JS", date: "2026-01", group: "Программирование", desc: "Первая страница на GitHub Pages.", progress: 100, done: true },
      { name: "Прототип собственного устройства", date: "2026-08", group: "Конструирование", desc: "От компонентов до программы.", children: [
        { name: "Подобрать компоненты", progress: 100, done: true },
        { name: "Собрать схему", progress: 30 },
        { name: "Написать прошивку", progress: 0 } ] } ] },
    { name: "Книги", children: [
      { name: "Фейнмановские лекции, т. 1", date: "2026-02", group: "Физика", desc: "Читаю главы и разбираю задачи.", progress: 45 },
      { name: "Популярная история науки", date: "2025-11", group: "История", desc: "Как появились идеи современной физики.", progress: 100, done: true } ] },
    { name: "Спорт", children: [
      { name: "Регулярные тренировки", date: "2026-04", group: "Режим", desc: "Три тренировки в неделю.", progress: 70 },
      { name: "Шахматы", desc: "Игра и подготовка к разряду.", children: [
        { name: "Турнирная практика", date: "2026-05", progress: 50 },
        { name: "Разряд шахматиста", desc: "Нужно выполнить норму на турнирах.", progress: 20 } ] } ] },
    { name: "Языки", children: [
      { name: "Английский: средний уровень", date: "2026-06", group: "Английский", desc: "Читаю технические тексты, учусь говорить свободнее.", progress: 65 },
      { name: "Подготовка к экзамену", date: "2026-10", group: "Сертификаты", desc: "План занятий и пробные тесты.", progress: 15 } ] },
    { name: "Личностный рост", children: [
      { name: "Меньше экранного времени", date: "2026-10", group: "Привычки", desc: "Сократить бесцельную прокрутку ленты.", progress: 40 },
      { name: "План поступления за границу", date: "2026-10", group: "Цели", desc: "Вузы, требования, сроки.", progress: 25 } ] }
  ]
};

(()=>{
const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),KEY='achv-tree-v1';
const svg=$('#map'),cam=$('#cam'),E=$('#edges'),N=$('#nodes'),box=$('#mapbox');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else if(k in e)e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e};
/* правка доступна только локально (file://, localhost) или с ?edit в адресе;
   правки хранятся в localStorage этого браузера и не меняют сайт для других */
let owner=false;
try{ /* открой сайт один раз со ссылкой ?edit — правка включится на этом устройстве; ?edit=off — выключится */
  if(/[?&#]edit=?off/.test(location.search+location.hash))localStorage.removeItem('achv-owner');
  else if(/[?&#]edit\b/.test(location.search+location.hash))localStorage.setItem('achv-owner','1');
  owner=localStorage.getItem('achv-owner')==='1';
}catch(e){}
const canEdit=owner||location.protocol==='file:'||['localhost','127.0.0.1'].includes(location.hostname);
const COL=['#7C93FF','#4FD1C5','#F2B45E','#F28DB2','#8FD66B','#B79BFF']; /* цвета сфер по порядку */
let uid=0;

function render(anim=true){
  lsum();
  if(box.style.display!=='block')return;
  W=box.clientWidth;H=box.clientHeight;cx=W/2;cy=H/2;R2=W<600?105:Math.min(W,H)*.2;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const root={n:D.root,id:'root',x:cx,y:cy,out:Math.PI/2,d:0,root:1},vis=[root];
  const n=D.tree.length,rx=Math.min(W*.34,H*.5),ry=Math.min(H*.33,W*.5);
  const place=it=>{
    const kids=it.n.children;if(!kids.length||!expanded.has(it.n.id))return;
    const m=kids.length,spread=Math.min(it.d>1?2.2:2.7,.8*(m-1)+.3),R=R2*(it.d>1?.85:1);
    kids.forEach((c,k)=>{
      const a=it.out+(m>1?(k/(m-1)-.5)*spread:0),r=R*(k%2?1.1:.85);
      const x=Math.min(W-50,Math.max(50,it.x+Math.cos(a)*r)),y=Math.min(H-40,Math.max(40,it.y+Math.sin(a)*r));
      const ch={n:c,id:c.id,x,y,out:Math.atan2(y-it.y,x-it.x),d:it.d+1,p:it,k,top:it.top,ci:it.ci};vis.push(ch);place(ch);
    });
  };
  D.tree.forEach((t,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n+(i%2?.12:-.08),q=i%2?1:.88,x=cx+rx*Math.cos(a)*q,y=cy+ry*Math.sin(a)*q;
    const it={n:t,id:t.id,x,y,out:Math.atan2(y-cy,x-cx),d:1,p:root,k:i,top:t.id,ci:i};vis.push(it);place(it);
  });
  /* разводим точки И подписи: считаем прямоугольник «точка + подпись» и раздвигаем пересекающиеся */
  const ML=W<700?17:28;
  const FS=v=>v.root?24:v.d===1?15:13,RR=v=>(v.root?7:[0,5,3.5,3,3][Math.min(v.d,4)])+5;
  const lblLen=v=>{const n=v.n,nm=n.name||'Без названия';let len=Math.min(nm.length,ML);
    if(!v.root){const kk=n.children.length;if(kk&&!expanded.has(n.id))len+=String(kk).length+1;if(v.d===1){const tm=minsOfCat(n.name);if(tm)len+=fmt(tm).length+3}}
    return len};
  vis.forEach(v=>v.ll=lblLen(v));
  const bx=v=>{
    const fs=FS(v),rr=RR(v),ang=v.root?Math.PI/2:v.out,c=Math.cos(ang),sn=Math.sin(ang),mid=Math.abs(c)<.35,off=v.root?30:rr+8;
    const w=v.ll*fs*.56+6,lx=v.x+c*off,by=v.y+sn*off+(mid?(sn>0?fs:-4):fs*.32);
    const x0=c>.35?lx:c<-.35?lx-w:lx-w/2,y0=by-fs*.95;let y1=by+fs*.3;if(v.root)y1+=44;
    return[Math.min(x0,v.x-rr)-3,Math.min(y0,v.y-rr)-2,Math.max(x0+w,v.x+rr)+3,Math.max(y1,v.y+rr)+2];
  };
  for(let k=0;k<200;k++){
    vis.forEach(v=>{if(v.p)v.out=Math.atan2(v.y-v.p.y,v.x-v.p.x)});
    let moved=false;
    for(let i=0;i<vis.length;i++)for(let j=i+1;j<vis.length;j++){
      const a=vis[i],b=vis[j],A=bx(a),B=bx(b);
      const ox=Math.min(A[2],B[2])-Math.max(A[0],B[0]),oy=Math.min(A[3],B[3])-Math.max(A[1],B[1]);
      if(ox<=0||oy<=0)continue;moved=true;
      const ma=a.root?0:b.root?1:.5,mb=a.root?1:b.root?0:.5;
      if(ox<oy){const sg=b.x>=a.x?1:-1,f=ox+3;a.x-=sg*f*ma;b.x+=sg*f*mb}
      else{const sg=b.y>=a.y?1:-1,f=oy+3;a.y-=sg*f*ma;b.y+=sg*f*mb}
    }
    vis.forEach(v=>{if(v.root)return;const q=bx(v);let sx=0,sy=0;
      if(q[0]<8)sx=8-q[0];else if(q[2]>W-8)sx=W-8-q[2];
      if(q[1]<8)sy=8-q[1];else if(q[3]>H-8)sy=H-8-q[3];
      v.x+=sx;v.y+=sy});
    if(!moved)break;
  }
  /* добивка: оставшиеся пересечения сдвигаем вниз по очереди */
  for(let k=0;k<12;k++){
    vis.forEach(v=>{if(v.p)v.out=Math.atan2(v.y-v.p.y,v.x-v.p.x)});let m2=false;
    const arr=vis.slice().sort((a,b)=>a.y-b.y);
    arr.forEach((b,i)=>{if(b.root)return;for(let j=0;j<i;j++){const A=bx(arr[j]),B=bx(b);
      const ox=Math.min(A[2],B[2])-Math.max(A[0],B[0]),oy=Math.min(A[3],B[3])-Math.max(A[1],B[1]);
      if(ox>0&&oy>0){b.y=Math.min(H-30,b.y+oy+2);m2=true}}});
    if(!m2)break;
  }
  vis.forEach(v=>{if(v.p)v.out=Math.atan2(v.y-v.p.y,v.x-v.p.x)});
  const act=D.tree.find(t=>expanded.has(t.id));const actId=act?act.id:null;
  const ids=new Set(vis.map(v=>v.id));
  for(const [id,o] of els)if(!ids.has(id)){els.delete(id);o.g.classList.add('out');o.ln&&o.ln.classList.add('out');setTimeout(()=>{o.g.remove();o.ln&&o.ln.remove()},350)}
  const now=performance.now();
  for(const it of vis){
    let o=els.get(it.id);
    if(!o){o=mk();els.set(it.id,o);if(!anim)o.t=-9999;
      const d=(it.root?0:.05+it.k*.08)+'s';o.nb.style.setProperty('--d',d);
      if(it.p){o.nb.style.setProperty('--fx',(it.p.x-it.x)+'px');o.nb.style.setProperty('--fy',(it.p.y-it.y)+'px');
        o.ln=el('line',{class:'edge',pathLength:1},E);o.ln.style.setProperty('--d',d)}}
    o.item=it;const n=it.n,kids=it.root?0:n.children.length,exp=expanded.has(n.id);
    const pr=it.root?0:prog(n),dn=!it.root&&isDone(n),dimmed=actId&&(it.root||it.top!==actId),fresh=now-o.t<1500;
    const r=it.root?7:[0,5,3.5,3,3][Math.min(it.d,4)],rr=r+5;
    o.g.setAttribute('class',['node',it.root?'root':it.d===1?'cat':'ach',dn&&'done',sel===n&&'sel',dimmed&&'dim',fresh&&'fresh'].filter(Boolean).join(' '));
    o.g.setAttribute('transform',`translate(${it.x} ${it.y})`);
    if(it.root)o.g.style.removeProperty('--c');else o.g.style.setProperty('--c',COL[it.ci%COL.length]);
    o.g.setAttribute('aria-label',n.name);
    o.track.setAttribute('r',rr);o.arc.setAttribute('r',rr);o.arc.setAttribute('stroke-dasharray',`${dn?100:pr} 100`);
    o.dot.setAttribute('r',r);o.hit.setAttribute('r',Math.max(W<700?22:18,rr+6));
    const ang=it.root?Math.PI/2:it.out,c=Math.cos(ang),s=Math.sin(ang),mid=Math.abs(c)<.35,fs=it.root?24:it.d===1?15:13,off=it.root?30:rr+8;
    o.txt.setAttribute('x',c*off);o.txt.setAttribute('y',s*off+(mid?(s>0?fs:-4):fs*.32));
    o.txt.setAttribute('text-anchor',c>.35?'start':c<-.35?'end':'middle');
    const nm=n.name||'Без названия';o.txt.textContent=nm.length>ML?nm.slice(0,ML-1)+'…':nm;
    if(kids&&!exp){el('tspan',{class:'cnt',dx:6},o.txt).textContent=kids}
    if(it.d===1){const tm=minsOfCat(n.name);if(tm)el('tspan',{class:'cnt',dx:6},o.txt).textContent='· '+fmt(tm)}
    if(it.root){if(!o.sub)o.sub=el('text',{class:'sub',transform:'translate(0 66)'},o.nb);o.sub.textContent=D.root.tagline||''}
    if(o.ln){
      o.ln.setAttribute('x1',it.p.x);o.ln.setAttribute('y1',it.p.y);o.ln.setAttribute('x2',it.x);o.ln.setAttribute('y2',it.y);
      o.ln.setAttribute('class','edge'+(dimmed?' dim':'')+(fresh?' fresh':''));
    }
  }
  /* камера: приближаемся к раскрытой категории, учитываем панель */
  const pan=document.body.classList.contains('pan'),mob=W<700,aw=W-(pan&&!mob?340:0),ah=pan&&mob?H*.48:H;
  let fx=cx,fy=cy,sc=Math.min(1,aw/(W*.82));
  if(act){
    const bs=vis.filter(v=>v.top===actId).map(bx);
    const x0=Math.min(...bs.map(q=>q[0])),x1=Math.max(...bs.map(q=>q[2])),y0=Math.min(...bs.map(q=>q[1])),y1=Math.max(...bs.map(q=>q[3]));
    fx=(x0+x1)/2;fy=(y0+y1)/2;sc=Math.max(.6,Math.min(1.5,aw/(x1-x0+50),ah/(y1-y0+50)));
  }
  cam.style.transform=`translate(${aw/2}px,${ah/2}px) scale(${sc}) translate(${-fx}px,${-fy}px)`;
}

function click(it){
  $('#hint').classList.add('gone');
  if(it.root){expanded.clear();sel=editing?D.root:null}
  else{
    const n=it.n;
    if(n.children.length){expanded.has(n.id)?collapseDeep(n):expand(n,it.d)}
    sel=n;
  }
  refresh();
}

    p.append(h('p',{class:'meta'},n.date||'',n.group?h('i',{},n.group):''),h('h2',{},n.name),h('div',{class:'bar'},b),h('p',{class:'pct'},dn?'Завершено':pr+'%'),tmRow(n));

  const stack=h('div',{class:'stack'},cl.map(([k,c])=>{const i=h('i',{title:k+': '+fmt(c.m)});i.style.flex=c.m;i.style.background=cc(k);return i}));

/* кнопка-иконка: из неё «вылетают» шарики дерева */
function toggleTree(open,scroll=true){
  const on=open===undefined?box.style.display!=='block':open;
  if(on){box.style.display='block';render();if(scroll)setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'start'}),60)}
  else{expanded.clear();sel=null;panel();els.clear();E.innerHTML=N.innerHTML='';box.style.display='none'}
  $('#lb').setAttribute('aria-expanded',on);
}
$('#lb').onclick=()=>toggleTree();
/* ===== СИНХРОНИЗАЦИЯ между устройствами через секретный Gist на GitHub =====
   Данные (дерево + журнал занятий) лежат в файле achievements.json вашего гиста.
   Побеждает самая свежая версия (по времени последней правки). */
const SK='achv-sync',RK='achv-rev',GF='achievements.json';
let cfg=null,REV=0,pt=null,syncMsg='';
try{cfg=JSON.parse(localStorage.getItem(SK));REV=+localStorage.getItem(RK)||0}catch(e){}
const gh=(m,body)=>fetch('https://api.github.com/gists/'+cfg.gist,{method:m,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body});
function setMsg(t){syncMsg=t;const e=$('#syncst');if(e)e.textContent=t}
function touch(){
  if(!canEdit)return;REV=Date.now();try{localStorage.setItem(RK,REV)}catch(e){}
  if(cfg){clearTimeout(pt);setMsg('Отправляю изменения…');pt=setTimeout(push,1500)}
}
async function push(){
  if(!cfg)return;pt=null;
  try{
    const r=await gh('PATCH',JSON.stringify({files:{[GF]:{content:JSON.stringify({rev:REV,...JSON.parse(ser()),log:LOG,goal:GOAL})}}}));
    if(!r.ok)throw new Error(r.status);
    setMsg('Синхронизировано в '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setMsg('Не удалось отправить ('+e.message+'). Проверьте токен, ID и интернет.')}
}
async function pull(){
  if(!cfg||pt)return;
  try{
    const r=await gh('GET');if(!r.ok)throw new Error(r.status);
    const f=(await r.json()).files[GF];let rem=null;
    try{rem=f&&JSON.parse(f.content)}catch(e){}
    if(rem&&rem.rev>REV&&rem.root&&Array.isArray(rem.tree)){
      D={root:rem.root,tree:rem.tree};D.tree.forEach(norm);LOG=Array.isArray(rem.log)?rem.log:[];REV=rem.rev;if(rem.goal>0){GOAL=rem.goal;try{localStorage.setItem(GK,GOAL)}catch(e){}}
      try{localStorage.setItem(KEY,ser());localStorage.setItem(LK,JSON.stringify(LOG));localStorage.setItem(RK,REV)}catch(e){}
      expanded.clear();sel=null;dash();refresh();setMsg('Загружены данные с другого устройства');
    }else if(!rem||!(rem.rev>=REV))await push();
    else setMsg('Синхронизировано: данные совпадают');
  }catch(e){setMsg('Не удалось загрузить ('+e.message+'). Проверьте токен и ID.')}
}
function syncCard(){
  const c=h('div',{class:'card'},h('h3',{},'СИНХРОНИЗАЦИЯ МЕЖДУ УСТРОЙСТВАМИ'));
  if(cfg){
    c.append(h('p',{class:'desc',id:'syncst'},syncMsg||'Подключено'),
      h('div',{class:'row',style:'margin-top:14px'},
        h('button',{class:'btn',onclick:()=>{pull().then(()=>toast('Готово'))}},'Синхронизировать сейчас'),
        h('button',{class:'btn danger',onclick:()=>{if(confirm('Отключить синхронизацию на этом устройстве?')){try{localStorage.removeItem(SK)}catch(e){}cfg=null;dash()}}},'Отключить')));
  }else{
    const tk=h('input',{type:'text',placeholder:'ghp_…'}),gi=h('input',{type:'text',placeholder:'ссылка или ID гиста'});
    [tk,gi].forEach(i=>{i.setAttribute('autocapitalize','off');i.setAttribute('autocomplete','off');i.spellcheck=false});
    c.append(h('label',{class:'f'},h('span',{},'Токен GitHub (с правом gist)'),tk),h('label',{class:'f'},h('span',{},'Ссылка на гист или его ID'),gi),
      h('button',{class:'btn on',onclick:()=>{
        const id=(gi.value.trim().split('#')[0].split('/').pop()||''),t=tk.value.trim();
        if(!id||!t){toast('Заполните оба поля');return}
        cfg={token:t,gist:id};try{localStorage.setItem(SK,JSON.stringify(cfg))}catch(e){}
        dash();pull();
      }},'Подключить'),
      h('p',{class:'note'},'Токен хранится только на этом устройстве. Подключить нужно один раз на каждом устройстве.'));
  }
  return c;
}
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('achv-theme',t)}catch(e){}$('#theme').textContent=t==='dark'?'☾':'☀';document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0D1015':'#F2F3F5'};
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(document.documentElement.dataset.theme==='light'?'light':'dark');

if(!canEdit)toggleTree(true,false);
if(cfg&&canEdit){pull();document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
})();
